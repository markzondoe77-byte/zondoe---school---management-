name: Build Zondoe School Management APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "No project ZIP found."
            exit 1
          fi

          echo "Found: $ZIP_FILE"

          mkdir project
          unzip -q "$ZIP_FILE" -d project

          echo "Extracted files:"
          find project -maxdepth 3 -type f | head -100

      - name: Locate project folder
        run: |
          PROJECT_DIR=$(find project -name package.json -type f -print -quit | xargs dirname)
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"
      - name: Fix TypeScript menu definition
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("src/App.tsx")
          s = p.read_text()

          start = s.index("const menu:")
          end = s.index("];", start) + 2

          menu = """const menu:{key:ModuleKey;label:string;icon:string}[]=[
          {key:"dashboard",label:"Dashboard",icon:"⌂"},
          {key:"onboarding",label:"School Registration",icon:"＋"},
          {key:"students",label:"Students",icon:"👤"},
          {key:"staff",label:"Teachers & Staff",icon:"★"},
          {key:"classes",label:"Classes & Subjects",icon:"▦"},
          {key:"attendance",label:"Attendance",icon:"✓"},
          {key:"fees",label:"Fees",icon:"$"},
          {key:"payments",label:"Payments",icon:"₿"},
          {key:"exams",label:"Exams & Results",icon:"A"},
          {key:"timetable",label:"Timetable",icon:"▤"},
          {key:"assignments",label:"Assignments",icon:"✎"},
          {key:"announcements",label:"Announcements",icon:"!"},
          {key:"reports",label:"Reports & Exports",icon:"▥"},
          {key:"expenses",label:"Expenses",icon:"−"},
          {key:"users",label:"Users & Roles",icon:"♙"},
          {key:"documents",label:"Documents",icon:"□"},
          {key:"settings",label:"School Settings",icon:"⚙"},
          {key:"ai",label:"AI Assistant",icon:"✦"}
          ];"""

          p.write_text(s[:start] + menu + s[end:])
          print("Fixed App.tsx menu definition")
          PY
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm install

      - name: Build web application
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor Android
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npm install @capacitor/core @capacitor/android
          npm install --save-dev @capacitor/cli

      - name: Add Android platform
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        working-directory: ${{ env.PROJECT_DIR }}
        run: npx cap sync android

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: chmod +x gradlew && ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zondoe-School-Management-APK
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
